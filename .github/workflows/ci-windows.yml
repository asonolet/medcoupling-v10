name: Tests on Windows

on:
  push:
    branches:
    - master
    - dev_v10

  pull_request:
    branches:
    - master

jobs:
  test:
    strategy:
      matrix:
        os: [windows-2019]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install Python
      uses: actions/setup-python@v5
      with: { python-version: "3.10" }

    - name: Conan cache
      uses: actions/cache@v4
      with:
        path: conan_cache_save.tgz
        key: conan-${{ matrix.os }}-${{ hashFiles('conan*.[pl][yo]*') }}

    - name: Setup conan
      shell: bash
      run: bash < .github/scripts/conan-ci-setup.sh

    - name: Conan install release dep
      shell: bash
      run: conan install . -o "*:shared=False" -b missing

    - name: Save cache
      run: conan cache save '*/*:*' --file=conan_cache_save.tgz

    - name: Debug ConanPresets
      shell: bash
      run: echo "CMakeUserPresets.json"; echo "==================="; cat CMakeUserPresets.json

    - name: Debug generators/CMakePresets
      shell: bash
      run: echo; find . -path "*/generators/CMakePresets.json" -exec cat {} \;

    - name: Configure multi-config generator
      shell: bash
      run: cmake --preset=conan-default

    - name: Build
      shell: bash
      run: cmake --build --preset=conan-release

    - name: Source runtime
      shell: bash
      run: .\\build\\generators\\conanrun.bat

    - name: Test
      shell: bash
      run: MEDCOUPLING_RESOURCE_DIR="${PWD}/resources" ctest --test-dir build/Release
      
    - name: Debug tests
      shell: bash
      run: echo $(ls -R .); cd build && find . -name UnitTestsResult | xargs cat
