name: Continuous Integration

on:
  push:
    branches:
    - master
    - dev_v10

  pull_request:
    branches:
    - master

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2019]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install Python
      uses: actions/setup-python@v5
      with: { python-version: "3.10" }

    - name: Conan cache
      uses: actions/cache@v4
      with:
        path: conan_cache_save.tgz
        key: conan-${{ matrix.os }}-${{ hashFiles('conan*.[pl][yo]*') }}

    - name: Install dependencies
      shell: bash
      run: bash < .github/scripts/conan-ci-setup.sh

    - name: Configure multi-config generator
      if: ${{ matrix.os == 'windows-2019'}}
      shell: bash
      run: cmake --preset=conan-default

    - name: Configure single-config generator
      if: ${{ matrix.os == 'ubuntu-22.04'}}
      shell: bash
      run: cmake --preset=conan-release

    - name: Build
      shell: bash
      run: cmake --build --preset=conan-release

    - name: Test
      shell: bash
      run: ctest --preset=conan-release || echo $(ls -R .); cd build && find . -name UnitTestsResult | xargs cat ; cd ..
