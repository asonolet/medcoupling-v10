name: Continuous Integration

on:
  push:
    branches:
    - master
    - dev_v10

  pull_request:
    branches:
    - master

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-22.04]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install Python
      uses: actions/setup-python@v5
      with: { python-version: "3.10" }

    - name: Conan cache
      uses: actions/cache@v4
      with:
        path: conan_cache_save.tgz
        key: conan-${{ matrix.os }}-${{ hashFiles('conan*.[pl][yo]*') }}

    - name: Setup dependencies
      shell: bash
      run: bash < .github/scripts/conan-ci-setup.sh

    - name: Conan install release dep
      shell: bash
      run: conan install . -o "*:shared=False" -b missing

    - name: Save cache
      run: conan cache save '*/*:*' --file=conan_cache_save.tgz

    - name: Configure single-config generator
      shell: bash
      run: cmake --preset=conan-release

    - name: Build
      shell: bash
      run: cmake --build --preset=conan-release

    - name: Test
      shell: bash
      run: MEDCOUPLING_RESOURCE_DIR="${PWD}/resources" ctest --test-dir build/Release
      
    - name: Debug tests
      shell: bash
      run: echo $(ls -R .); cd build && find . -name UnitTestsResult | xargs cat
